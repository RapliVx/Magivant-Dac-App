name: Build Apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Android SDK Platform 37
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            else
              echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" || true
              if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
                ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
              fi
            fi
          fi

      - name: Write key
        run: |
          KEYSTORE_CONTENT="${{ secrets.KEYSTORE || secrets.KEYSTORE_BASE64 }}"
          if [ -n "$KEYSTORE_CONTENT" ]; then
            echo "" >> gradle.properties
            sed -i '/KEYSTORE_FILE/d' gradle.properties
            sed -i '/KEYSTORE_PASSWORD/d' gradle.properties
            sed -i '/KEY_ALIAS/d' gradle.properties
            sed -i '/KEY_PASSWORD/d' gradle.properties
            {
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
              echo KEYSTORE_FILE='key.jks'
            } >> gradle.properties
            echo "$KEYSTORE_CONTENT" | base64 -d > key.jks
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --parallel --build-cache --no-daemon

      - name: Extract Version & Rename APK
        id: rename_apk
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Detected Version: $VERSION_NAME"
          
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          NEW_APK_NAME="Magivant-DAC-$VERSION_NAME.apk"
          
          mv "$APK_PATH" "$NEW_APK_NAME"
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APK_FILE=$NEW_APK_NAME" >> $GITHUB_ENV

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Magivant DAC v${{ env.VERSION_NAME }}
          body: |
            Automated release build for **Magivant DAC v${{ env.VERSION_NAME }}**.
            
            **How to install:**
            1. Download the `.apk` file from the **Assets** section below.
            2. Install it on your Android device.
            3. Connect your Leteciel DAC and grant USB access.
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}