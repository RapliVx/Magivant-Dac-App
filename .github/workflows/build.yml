name: Build Android and Linux

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rename_apk.outputs.version_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Android SDK Platform 37
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-37" || test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Prepare release signing
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE || secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_CONTENT:?Missing release keystore}"
          : "${SIGNING_STORE_PASSWORD:?Missing keystore password}"
          : "${SIGNING_KEY_ALIAS:?Missing key alias}"
          : "${SIGNING_KEY_PASSWORD:?Missing key password}"
          umask 077
          printf '%s' "$KEYSTORE_CONTENT" | base64 --decode > "$RUNNER_TEMP/magivant-release.jks"
          echo "ORG_GRADLE_PROJECT_KEYSTORE_FILE=$RUNNER_TEMP/magivant-release.jks" >> "$GITHUB_ENV"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --max-workers=1

      - name: Build Debug APK
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --no-daemon --max-workers=1

      - name: Upload Debug APK artifact
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Magivant-DAC-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify published release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          EXPECTED_TAG="v$VERSION_NAME"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match expected tag '$EXPECTED_TAG'." >&2
            exit 1
          fi

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --parallel --build-cache --no-daemon

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/magivant-release.jks"

      - name: Extract Version & Rename APK
        id: rename_apk
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Detected Version: $VERSION_NAME"
          
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          NEW_APK_NAME="Magivant-DAC-$VERSION_NAME.apk"
          
          mv "$APK_PATH" "$NEW_APK_NAME"
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APK_FILE=$NEW_APK_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Artifacts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install RPM packaging tools
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Install Debian packaging tools
        run: sudo apt-get install --yes fakeroot dpkg-dev

      - name: Test and package Linux app
        env:
          LINUX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tasks=( :shared:test :desktopApp:test :desktopApp:createDistributable :desktopApp:packageDeb :desktopApp:packageRpm )
          ./gradlew "${tasks[@]}" --no-daemon --max-workers=1

      - name: Prepare Linux artifacts
        id: linux_artifacts
        env:
          LINUX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*packageVersion = "\([^"]*\)".*/\1/p' desktopApp/build.gradle.kts)
          test -n "$VERSION"

          ARTIFACT_DIR="$RUNNER_TEMP/magivant-linux-artifacts"
          APP_IMAGE="desktopApp/build/compose/binaries/main/app/magivant-dac"
          mkdir -p "$ARTIFACT_DIR"
          tar -C "$(dirname "$APP_IMAGE")" -czf "$ARTIFACT_DIR/Magivant-DAC-Linux-$LINUX_ARCH-$VERSION.tar.gz" magivant-dac
          tar -C linux -czf "$ARTIFACT_DIR/Magivant-DAC-Linux-$LINUX_ARCH-USB-access.tar.gz" README.md 70-magivant-dac.rules install-udev-rule.sh

          mapfile -t DEB_PACKAGES < <(find desktopApp/build/compose/binaries/main -type f -name '*.deb')
          test "${#DEB_PACKAGES[@]}" -eq 1
          cp "${DEB_PACKAGES[0]}" "$ARTIFACT_DIR/"

          mapfile -t RPM_PACKAGES < <(find desktopApp/build/compose/binaries/main -type f -name '*.rpm')
          test "${#RPM_PACKAGES[@]}" -eq 1
          cp "${RPM_PACKAGES[0]}" "$ARTIFACT_DIR/"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Magivant-DAC-Linux-${{ matrix.arch }}-${{ steps.linux_artifacts.outputs.version }}
          path: ${{ runner.temp }}/magivant-linux-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Android and Linux release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs:
      - build-android
      - build-linux
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Magivant-DAC-${{ needs.build-android.outputs.version }}.apk
          path: release-assets

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: Magivant-DAC-Linux-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with Android and Linux assets
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android.outputs.version }}
          name: Magivant DAC v${{ needs.build-android.outputs.version }}
          body: |
            Automated Android and Linux build for **Magivant DAC v${{ needs.build-android.outputs.version }}**.

            **Linux downloads:** x86_64 and ARM64 app images, Debian and RPM packages for both architectures, plus the udev permission helper. Install the included udev rule and reconnect the DAC before using the hardware controls.

            **Android installation:** Download the `.apk` file below, install it, then connect your Leteciel DAC and grant USB access.
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to published GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
